name: Feature request
description: Propose an improvement grounded in a real CMD workflow.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the moment and friction before proposing the interface.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What should become easier or possible?
    validations:
      required: true
  - type: textarea
    id: current_workaround
    attributes:
      label: What do you do today?
  - type: textarea
    id: proposal
    attributes:
      label: Suggested approach
      description: Include interaction details if you already have an idea.
  - type: textarea
    id: safety
    attributes:
      label: Authority or safety considerations
      description: Note any data access, approval, external effect, or reversibility concern.
