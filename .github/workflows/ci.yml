name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
      - "agent/**"

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            requirements-connectors.txt
            requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Reject runtime state in Git
        run: |
          set -euo pipefail
          tracked="$(git ls-files '.cmd' '.daily-[c]ockpit' '*.db' '.env' '.env.*' ':(exclude).env.example' || true)"
          if [ -n "$tracked" ]; then
            echo "Runtime state or secrets are tracked:"
            echo "$tracked"
            exit 1
          fi

      - name: Compile Python
        run: python -m compileall -q .

      - name: Audit resolver-independent public foundation
        run: python scripts/audit_public_foundation.py

      - name: Build and audit manifest-bounded public snapshot
        run: |
          python scripts/build_public_snapshot.py "${RUNNER_TEMP}/cmd-public-snapshot"
          python scripts/audit_public_snapshot.py "${RUNNER_TEMP}/cmd-public-snapshot"

      - name: Run unit tests
        run: python -m unittest discover -s . -p 'test_*.py'

      - name: Exercise disposable full lifecycle
        if: matrix.python-version == '3.13'
        run: python scripts/run_lifecycle_canary.py

      - name: Exercise adversarial local-server boundary
        if: matrix.python-version == '3.13'
        run: python scripts/run_server_security_canary.py

      - name: Validate independent public snapshot
        if: matrix.python-version == '3.13'
        run: python scripts/validate_public_snapshot.py "${RUNNER_TEMP}/cmd-public-snapshot"
